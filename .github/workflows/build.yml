name: package

# Tag push (v*) builds the installers and opens a DRAFT GitHub release with the
# artifacts attached. Download the draft, install it on a real machine, and
# publish it from the GitHub UI once it checks out.
#
# Manual runs (workflow_dispatch) only build and keep artifacts in the run;
# no release is created because there is no tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Only the Apple Silicon dmg ships in the first release. Re-add rows
        # here (and their patterns in the release job) when other platforms
        # should be published too:
        #   - os: windows-latest / command: npm run dist:win / artifacts: release/*.exe
        #   - os: macos-13       / command: npx electron-builder --mac --x64 / release/*.dmg
        include:
          - os: macos-14
            name: macos-arm64
            command: npx electron-builder --mac --arm64
            artifacts: release/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and SDK smoke tests
        run: npm test

      - name: Build bundles
        run: npm run build:app

      - name: Package
        # mac.identity is "-" in electron-builder.yml, so the app is ad-hoc
        # signed here. Without a Developer ID certificate macOS will warn on
        # first launch; the release notes explain the one-time bypass.
        run: ${{ matrix.command }}

      - name: Verify SDK binary unpacked from asar
        run: node scripts/verify-package.mjs

      - name: Show artifacts
        run: ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Relay ${{ github.ref_name }}
          body_path: docs/release-notes.md
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
