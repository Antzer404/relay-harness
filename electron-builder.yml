appId: com.antzer404.relay
productName: Relay
copyright: Copyright © 2026 Antzer404

directories:
  buildResources: build
  output: release

# electron-vite writes main/preload/renderer bundles to out/.
# Production dependencies are added automatically; dev dependencies are pruned.
files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.env,.env.*,.npmrc,README.md}'
  - '!{docs,tests,scripts}/**'
  - '!**/*.{md,map}'
  # The SDK ships one native CLI per platform. npm may also pull the musl build
  # on glibc Linux; never ship the duplicate.
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk-*-musl/**'

asar: true
asarUnpack:
  # Only the per-platform packages that contain the native `claude` binary.
  # The SDK JS itself stays inside app.asar.
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'

# Skills bundled with the app; installed into CLAUDE_CONFIG_DIR/skills on
# first launch. Kept outside asar so the CLI and users can read them directly.
extraResources:
  - from: resources/builtin-skills
    to: builtin-skills

npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Relay

mac:
  target:
    - target: dmg
  category: public.app-category.developer-tools
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # No Developer ID certificate yet, so sign ad-hoc ("-"): Apple Silicon refuses
  # to launch a completely unsigned bundle, while an ad-hoc signature runs after
  # Gatekeeper is bypassed once (right-click → Open or `xattr -cr`). The
  # entitlements already disable library validation, which hardened runtime
  # requires for an ad-hoc signature to load Electron's framework.
  # Replace this with the certificate name (and enable notarization) once a
  # Developer ID is available.
  identity: '-'
  notarize: false

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

publish: null
